[project]
name = "ga-timesheet"
version = "0.1.0"
description = "Geofenced time clock for graduate assistants"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django~=5.2",
    "django-allauth[socialaccount]>=65.22.1",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-simple-history>=3.13.0",
    "django-tailwind-cli>=4.8.2",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "sentry-sdk[django]>=2.75.0",
    "weasyprint>=70.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
