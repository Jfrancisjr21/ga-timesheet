services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ga
      POSTGRES_PASSWORD: ga
      POSTGRES_DB: ga_timesheet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ga -d ga_timesheet"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
