name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ga
          POSTGRES_PASSWORD: ga
          POSTGRES_DB: ga_timesheet
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://ga:ga@localhost:5432/ga_timesheet
      SECURE_SSL_REDIRECT: "False"
      SCHOOL_EMAIL_DOMAINS: school.edu,student.school.edu
      MS_CLIENT_ID: ci-placeholder
      TIME_ZONE: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: PDF libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py check
      - run: uv run pytest
